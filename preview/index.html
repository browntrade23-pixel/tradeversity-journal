<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<title>TRADEVERSITY · visitor preview</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="See the Tradeversity trading journal with sample data. No account needed, nothing is saved.">
<meta property="og:title" content="TRADEVERSITY · visitor preview">
<meta property="og:description" content="See the platform with sample data. No account needed.">
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(700px 400px at 50% -10%,rgba(58,72,224,.35),transparent 70%),#030407;color:#e8ebf5;font:15px Inter,system-ui,sans-serif;text-align:center;padding:20px}
.box{max-width:420px}h1{font-size:24px;margin:0 0 10px}p{color:#a0a6b8;line-height:1.5}a.b{display:inline-block;margin-top:14px;padding:12px 22px;border-radius:999px;background:linear-gradient(180deg,#ffd27a,#f5b942);color:#1b1305;font-weight:800;text-decoration:none}</style>
</head><body><div class="box" id="box"><p>Opening the visitor preview…</p></div>
<script>
/* A visitor link is valid for 48 hours: ?e = expiry time (seconds, base 36), made by the admin dashboard. */
(function(){const q=new URLSearchParams(location.search),e=q.get("e"),exp=e?parseInt(e,36)*1000:0;
  if(exp&&Date.now()<exp&&exp-Date.now()<=49*3600e3){location.replace("../?demo=1&visit=1&e="+encodeURIComponent(e)+"#today");return}
  const ar=(navigator.language||"").startsWith("ar"),fr=(navigator.language||"").startsWith("fr");
  const T=ar?["انتهت صلاحية رابط المعاينة","روابط الزوار صالحة لمدة 48 ساعة. اطلب رابطًا جديدًا من Tradeversity.","اكتشف Tradeversity"]
    :fr?["Ce lien d'aperçu a expiré","Les liens visiteurs sont valables 48 heures. Demandez un nouveau lien à Tradeversity.","Découvrir Tradeversity"]
    :["This preview link has expired","Visitor links are valid for 48 hours. Ask Tradeversity for a new link.","Discover Tradeversity"];
  document.getElementById("box").innerHTML=`<h1>⏳ ${T[0]}</h1><p>${T[1]}</p>`;if(ar)document.body.dir="rtl"})();
</script></body></html>
